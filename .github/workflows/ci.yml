# Apple CI: XcodeGen drift check, Swift package tests and unsigned builds of the three app schemes.
# The project targets OS 27 (Xcode 27). Hosted GitHub macOS images may not provide Xcode 27 yet, so the runner label is
# configurable: set the repository variable APPLE_RUNNER (Settings > Secrets and variables > Actions > Variables), for
# example to a self-hosted label such as "self-hosted-macos-27". Default without the variable: the GitHub-hosted Xcode 27 image `xcode-27`
# (generally available since 2026-10-15, macOS 27, Apple Silicon only).
# Documentation: docs/CI.md in the backend repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  project:
    name: XcodeGen drift check
    runs-on: ${{ vars.APPLE_RUNNER || 'xcode-27' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Pinned: runner images ship different Homebrew versions, and a newer XcodeGen writes the project differently.
      # Update version and checksum together with a regenerated project.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the project and fail if the tracked project differs
        run: |
          xcodegen --version
          xcodegen generate
          git diff --exit-code -- Timetrack.xcodeproj || {
            echo "::error::Timetrack.xcodeproj is out of date. Run 'xcodegen generate' and commit (XcodeGen version differences can also cause this)."
            exit 1
          }

  packages:
    name: Swift packages (${{ matrix.package }})
    runs-on: ${{ vars.APPLE_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: [TimetrackCore, TimetrackDesign]
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test --build-system native

  build:
    name: Build ${{ matrix.scheme }}
    runs-on: ${{ vars.APPLE_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: TimetrackIOS
            destination: generic/platform=iOS Simulator
          - scheme: TimetrackMac
            destination: platform=macOS
          - scheme: TimetrackWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v7
      - name: Xcode version
        run: xcodebuild -version
      - name: xcodebuild (unsigned)
        run: |
          xcodebuild -project Timetrack.xcodeproj -scheme "${{ matrix.scheme }}" -configuration Debug \
            -destination "${{ matrix.destination }}" -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build
