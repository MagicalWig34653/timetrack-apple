# NICHT GETESTET. Manual TestFlight upload skeleton (archive, export, upload). It cannot be run before the paid Apple
# Developer Program account is active and the App Store Connect API key exists. Treat it as a starting point and expect
# to adjust it (export options, bundle IDs of the embedded watch app and widgets, build number policy).
# Required repository secrets (names only; never commit values):
#   APP_STORE_CONNECT_API_KEY_ID      Key ID of the App Store Connect API key
#   APP_STORE_CONNECT_API_ISSUER_ID   Issuer ID of the team
#   APP_STORE_CONNECT_API_KEY         content of the AuthKey_<ID>.p8 file
#   APPLE_TEAM_ID                     Team ID
# Signing: automatic provisioning with the API key (-allowProvisioningUpdates plus authenticationKey* flags). No
# certificates or profiles are stored in the repository. The runner label comes from vars.APPLE_RUNNER (see ci.yml).
name: TestFlight (nicht getestet)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to archive"
        type: choice
        options: [ios, macos]
        default: ios
      build_number:
        description: "CURRENT_PROJECT_VERSION (must be higher than the last upload)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ${{ vars.APPLE_RUNNER || 'xcode-27' }}
    timeout-minutes: 90
    environment: testflight
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PLATFORM: ${{ inputs.platform }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Write the API key to a temporary file
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8"
      - name: Archive
        run: |
          if [ "$PLATFORM" = ios ]; then scheme=TimetrackIOS; dest="generic/platform=iOS"; else scheme=TimetrackMac; dest="generic/platform=macOS"; fi
          xcodebuild -project Timetrack.xcodeproj -scheme "$scheme" -configuration Release -destination "$dest" \
            -archivePath "$RUNNER_TEMP/Timetrack.xcarchive" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Timetrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
