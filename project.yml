name: Timetrack
options:
  bundleIdPrefix: de.linolaske
  developmentLanguage: de
packages:
  TimetrackCore:
    path: Packages/TimetrackCore
  TimetrackDesign:
    path: Packages/TimetrackDesign
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J2DU2P47XW
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "43"
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  TimetrackMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - Sources/Mac
      - Sources/Planning # A10: absences, calendar, vacation settings (shared with iOS)
      - Sources/Common # UX3: day standing card, sync status line, shared strings (UX3 table)
      - Sources/Settings # N1b: work model editor, vacation figures, about section (shared with iOS)
      - Sources/Week # PL1: week planner, week overview, vacation planner, planning area (shared with iOS)
      - Sources/Reports # BH1: Berichtsheft (shared with iOS)
      - Sources/Statistics # WM2: Statistik with Swift Charts (shared with iOS; macOS target)
      - Sources/Suggestions # SG1: suggestions list, cancelled bin, Q1 wording (shared with iOS)
      - Sources/WidgetShared # A7: snapshot publisher and widget views (debug gallery)
      - Sources/Location/LocationService.swift # M2: CoreLocation layer (region monitoring) shared with iOS
      # M2: EventKit device calendars (E1/E2 code shared with iOS; the demo pages stay iOS only)
      - Sources/Calendar/CalendarEnvironment.swift
      - Sources/Calendar/EventKitProvider.swift
      - Sources/Calendar/CalendarSettingsView.swift
      # A6b: Icon Composer icon (primary). See docs/ICONS.md.
      - path: Icons/TimetrackPrimary.icon
        buildPhase: resources
    dependencies:
      - package: TimetrackCore
        product: TimetrackCore
      - package: TimetrackCore
        product: TimetrackStores
      - package: TimetrackDesign
        product: TimetrackDesign
      - target: TimetrackWidgetMac # A7
        embed: true
    settings:
      base:
        # Universal purchase: iOS and macOS share one bundle ID. A future watchOS app uses de.linolaske.timetrack.watchkitapp.
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack
        PRODUCT_NAME: Timetrack
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Sources/Mac/TimetrackMac.entitlements # A7: App Group for the widget snapshot
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Timetrack
        # TLS/WebAuthn via system frameworks only: exempt encryption, skips the TestFlight export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: TimetrackPrimary # A6b
    info:
      path: Sources/Mac/Info.plist
      properties:
        # Plain http is allowed only for local networking (development servers on localhost / the LAN).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # M2: places automation on the Mac (CoreLocation region monitoring). The text is shown in the system permission dialog.
        NSLocationUsageDescription: Mit dem Standort erkennt Timetrack, wenn dein Mac einen deiner Orte (zum Beispiel „Büro“) betritt oder verlässt. Der Standort bleibt auf dem Mac; gemeldet werden nur Ort und Uhrzeit.
        NSLocationWhenInUseUsageDescription: Timetrack nutzt deinen Standort, um Orte anzulegen und eine Ankunft nach der Wartezeit zu prüfen.
        NSCalendarsFullAccessUsageDescription: Timetrack zeigt Termine der von dir gewählten Kalender im Tag als Kontext. Die Termine bleiben auf diesem Mac. Schreiben tut Timetrack nur, wenn du es in den Einstellungen einschaltest, und nur in den eigenen Kalender „Timetrack“.
  TimetrackIOS:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources/Fonts # LA4: animation-frame fonts (ticking Text(timerInterval:) digits are the poses)
        buildPhase: resources
      - Sources/iOS
      - Sources/Location # L2: location automation (region monitoring, shortcuts)
      - Sources/Focus # F2: Focus filter, notifications, explainer page
      - Sources/Planning # A10
      - Sources/Common # UX3: day standing card, sync status line, shared strings (UX3 table)
      - Sources/Settings # N1b
      - Sources/Calendar # E1: EventKit device calendars (iOS only; macOS does not use it yet)
      - Sources/Week # N1a: week overview, week planner, vacation planner; PL1: planning area (shared with macOS)
      - Sources/Reports # BH1: Berichtsheft (shared with macOS)
      - Sources/Statistics # WM2: Statistik with Swift Charts (iOS target)
      - Sources/Suggestions # SG1: suggestions list, cancelled bin, Q1 wording (shared with macOS)
      - Sources/Reminders # R3: local reminders to submit planned vacation, OT1 overwork notifications (iOS only)
      - Sources/WidgetShared # A7: snapshot publisher, widget intents, Live Activity, debug gallery
      # A6b: primary + alternate Icon Composer icons. See docs/ICONS.md.
      - path: Icons/TimetrackPrimary.icon
        buildPhase: resources
      # A6c: accent alternates (generated by scripts/icons/build_icons.py)
      - path: Icons/TimetrackTeal.icon
        buildPhase: resources
      - path: Icons/TimetrackViolet.icon
        buildPhase: resources
      - path: Icons/TimetrackGreen.icon
        buildPhase: resources
      - path: Icons/TimetrackOrange.icon
        buildPhase: resources
      - path: Icons/TimetrackPink.icon
        buildPhase: resources
      # IC1: motif x background alternates (generated by scripts/icons/motif_icons.py)
      - path: Icons/TimetrackClockLight.icon
        buildPhase: resources
      - path: Icons/TimetrackClockDark.icon
        buildPhase: resources
      - path: Icons/TimetrackStopwatch.icon
        buildPhase: resources
      - path: Icons/TimetrackTimer.icon
        buildPhase: resources
      - path: Icons/TimetrackHourglass.icon
        buildPhase: resources
      - path: Icons/TimetrackBars.icon
        buildPhase: resources
      - path: Icons/TimetrackCheck.icon
        buildPhase: resources
      - path: Icons/TimetrackMonogramT.icon
        buildPhase: resources
      - path: Icons/TimetrackMonogramC.icon
        buildPhase: resources
      - path: Icons/TimetrackSunset.icon
        buildPhase: resources
    dependencies:
      - package: TimetrackCore
        product: TimetrackCore
      - package: TimetrackCore
        product: TimetrackStores
      - package: TimetrackDesign
        product: TimetrackDesign
      - target: TimetrackWatch
        embed: true
      - target: TimetrackWidgetIOS # A7
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack
        PRODUCT_NAME: Timetrack
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: TimetrackPrimary # A6b
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "TimetrackTeal TimetrackViolet TimetrackGreen TimetrackOrange TimetrackPink TimetrackClockLight TimetrackClockDark TimetrackStopwatch TimetrackTimer TimetrackHourglass TimetrackBars TimetrackCheck TimetrackMonogramT TimetrackMonogramC TimetrackSunset" # A6c, IC1
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Timetrack
        # TLS/WebAuthn via system frameworks only: exempt encryption, skips the TestFlight export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          # Debug has no Associated Domains so it signs with a free personal team (device runs, cookie import).
          # With a paid Developer Program team set CODE_SIGN_ENTITLEMENTS to Sources/iOS/TimetrackDebug.entitlements
          # (also trusts the test instance via ?mode=developer) to try passkeys.
          CODE_SIGN_ENTITLEMENTS: Sources/iOS/TimetrackPersonal.entitlements # A7: App Group + shared keychain group (was "")
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/iOS/Timetrack.entitlements
    info:
      path: Sources/iOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true # A7
        UIAppFonts: [TTFramesShovel.ttf, TTFramesBriefcase.ttf] # LA4
        # L2: location automation. Region monitoring needs no `location` background mode; only the app-refresh task is registered.
        NSLocationWhenInUseUsageDescription: Timetrack nutzt deinen Standort, um Orte anzulegen und eine Ankunft nach der Wartezeit zu prüfen.
        NSLocationAlwaysAndWhenInUseUsageDescription: Mit „Immer“ kann iOS Timetrack beim Betreten und Verlassen deiner Orte kurz wecken, damit Ankunft und Abfahrt erkannt werden. Die App fragt den Standort nicht laufend ab; gemeldet werden nur Ort und Uhrzeit.
        NSLocationTemporaryUsageDescriptionDictionary:
          AutomationVerification: Für die Standortautomatik braucht Timetrack einmalig den genauen Standort, um Ankünfte zuverlässig zu erkennen.
        # E1: EventKit. Reading events needs full access; Timetrack writes only after the user switches it on, and only to its own calendar.
        NSCalendarsFullAccessUsageDescription: Timetrack zeigt Termine der von dir gewählten Kalender im Tag als Kontext. Die Termine bleiben auf diesem Gerät. Schreiben tut Timetrack nur, wenn du es in den Einstellungen einschaltest, und nur in den eigenen Kalender „Timetrack“.
        # AB1: the document scanner (VisionKit) for sick notes and other absence attachments; images stay on the device until the user saves them as an attachment.
        NSCameraUsageDescription: Timetrack scannt mit der Kamera Dokumente wie einen Krankenschein, damit du sie an eine Abwesenheit anhängen kannst. Das Bild wird nur hochgeladen, wenn du es speicherst.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [de.linolaske.timetrack.automation.refresh, de.linolaske.timetrack.focus.retry]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: de.linolaske.timetrack.quick.start
            UIApplicationShortcutItemTitle: Timer starten
            UIApplicationShortcutItemIconSymbolName: play.fill
          - UIApplicationShortcutItemType: de.linolaske.timetrack.quick.stop
            UIApplicationShortcutItemTitle: Timer stoppen
            UIApplicationShortcutItemIconSymbolName: stop.fill
  TimetrackWatch:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - Sources/Watch
      - path: Sources/Common/UX3.xcstrings # H5: "Fortführen" wording shared with iOS/macOS (UX3 table)
      # A6b: primary Icon Composer icon.
      - path: Icons/TimetrackPrimary.icon
        buildPhase: resources
      # Debug gallery renders the complication views inside the app (no complication placement possible headlessly).
      - path: Sources/Widget/ComplicationView.swift
      - path: Sources/Widget/Complication.xcstrings
    dependencies:
      - package: TimetrackCore
        product: TimetrackCore
      - package: TimetrackCore
        product: TimetrackStores
      - package: TimetrackDesign
        product: TimetrackDesign
      - target: TimetrackWidget
        embed: true
    settings:
      base:
        # App Group for the complication's non-secret snapshot. Needs a team that can provision App Groups (see docs/handoffs/A5.md).
        CODE_SIGN_ENTITLEMENTS: Sources/Watch/TimetrackWatch.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack.watchkitapp
        PRODUCT_NAME: Timetrack
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_CFBundleDisplayName: Timetrack
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: de.linolaske.timetrack
        ASSETCATALOG_COMPILER_APPICON_NAME: TimetrackPrimary # A6b
    info:
      path: Sources/Watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: de.linolaske.timetrack
        # The watch talks to the server directly (ADR-0015); the iPhone only hands over the session.
        WKRunsIndependentlyOfCompanionApp: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  TimetrackWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    sources: [Sources/Widget]
    dependencies:
      - package: TimetrackCore
        product: TimetrackCore
      - package: TimetrackDesign # A8: accent derivation for the account accent
        product: TimetrackDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack.watchkitapp.widget
        PRODUCT_NAME: TimetrackWidget
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/TimetrackWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Timetrack
        SKIP_INSTALL: YES
    info:
      path: Sources/Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # A7: iOS/iPadOS widgets, Lock Screen widgets, Live Activity and Control Center control
  TimetrackWidgetIOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - Sources/WidgetIOS
      - Sources/WidgetShared
      - path: Sources/Fonts # LA4: animation-frame fonts (ticking Text(timerInterval:) digits are the poses)
        buildPhase: resources
    dependencies:
      - package: TimetrackCore
        product: TimetrackCore
      - package: TimetrackCore
        product: TimetrackStores
      - package: TimetrackDesign
        product: TimetrackDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack.widget
        PRODUCT_NAME: TimetrackWidgetIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Sources/WidgetIOS/TimetrackWidgetIOS.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Timetrack
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    info:
      path: Sources/WidgetIOS/Info.plist
      properties:
        UIAppFonts: [TTFramesShovel.ttf, TTFramesBriefcase.ttf] # LA4
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
  # A7: macOS widgets (display only)
  TimetrackWidgetMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - Sources/WidgetMac
      - Sources/WidgetShared
    dependencies:
      - package: TimetrackCore
        product: TimetrackCore
      - package: TimetrackCore
        product: TimetrackStores
      - package: TimetrackDesign
        product: TimetrackDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack.widget
        PRODUCT_NAME: TimetrackWidgetMac
        CODE_SIGN_ENTITLEMENTS: Sources/WidgetMac/TimetrackWidgetMac.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timetrack
        SKIP_INSTALL: YES
    info:
      path: Sources/WidgetMac/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TimetrackIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"
    sources: [Tests/iOSUI]
    dependencies:
      - target: TimetrackIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.linolaske.timetrack.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TimetrackWatch:
    build:
      targets: { TimetrackWatch: all }
    run: { config: Debug }
  TimetrackMac:
    build:
      targets: { TimetrackMac: all }
    run: { config: Debug }
  TimetrackIOS:
    build:
      targets: { TimetrackIOS: all }
    test:
      targets: [TimetrackIOSUITests]
    run: { config: Debug }
